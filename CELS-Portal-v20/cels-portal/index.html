<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | CELS Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#3b4652;color:#fff;font:16px/1.4 Lato,"Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:56px 20px}
.wrap{width:100%;max-width:520px}
.logo{display:flex;align-items:center;gap:18px;margin-bottom:44px}
.logo img{width:84px;height:84px;border-radius:50%;background:#fff;object-fit:cover}
.logo b{font-size:30px;letter-spacing:3px;font-weight:700;line-height:1.1}.logo small{display:block;font-size:12px;letter-spacing:1px;font-weight:400;opacity:.8}
label{display:block;font-weight:700;font-size:20px;margin:0 0 8px}
input[type=email],input[type=password]{width:100%;height:50px;border:2px solid #cfd6dd;border-radius:4px;padding:0 12px;font:inherit;color:#1f2933;background:#fff;margin-bottom:26px}
input:focus{outline:0;border-color:#6d95c8;box-shadow:0 0 0 2px #6d95c855}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.chk{display:flex;align-items:center;gap:8px;font-size:17px}.chk input{width:18px;height:18px}
a{color:#fff}.row a{display:inline-block;margin-top:8px;font-size:17px}
.btn{height:48px;border-radius:4px;font:inherit;font-size:17px;cursor:pointer;border:1px solid #fff;background:transparent;color:#fff;padding:0 28px}
.btn:hover{background:#ffffff1f}.btn:focus-visible{outline:2px solid #6cb4ee;outline-offset:2px}
.or{display:flex;align-items:center;gap:12px;margin:26px 0 18px;color:#c3ccd5;font-size:14px}.or:before,.or:after{content:"";flex:1;height:1px;background:#ffffff40}
.g{width:100%;background:#fff;color:#1f2933;border-color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700}
.g:hover{background:#eef1f4}
.msg{color:#ffb4ab;min-height:22px;margin:-12px 0 14px;font-size:15px}
footer{margin-top:56px;text-align:center;font-size:15px}footer a{margin:0 12px;display:inline-block;margin-bottom:10px}
footer p{margin:22px 0 0;font-size:13px;letter-spacing:1.5px;opacity:.85}
.demo{margin-top:28px;font-size:12px;color:#aab4be;text-align:center}
</style></head><body>

<script>
const sb=CELS.sb,demo=new URLSearchParams(location.search).has("demo"),msg=t=>document.getElementById("m").textContent=t;
if(demo)document.getElementById("demo").hidden=false;
async function route(){if(!sb)return;const{data:{session}}=await sb.auth.getSession();if(!session)return;
 const{data:p}=await sb.from("profiles").select("role,status").eq("id",session.user.id).maybeSingle();
 if(!p){await sb.auth.signOut();msg("Your account is not registered with CELS. Please contact the administrator.");return}
 if(p.status!=="active"){await sb.auth.signOut();msg("This account is "+p.status+". Please contact the administrator.");return}
 location.href=p.role+"/dashboard.html"}
f.onsubmit=async ev=>{ev.preventDefault();msg("");
 if(demo){const r=CELS.signIn(e.value,p.value);r.error?msg(r.error):location.href=r.url;return}
 if(!sb){msg("Cannot reach the sign-in service. Check your internet connection.");return}
 const{error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});
 if(error){msg("Incorrect email or password.");return}await route()};
g.onclick=async()=>{msg("");if(!sb)return msg("Cannot reach the sign-in service.");
 if(location.protocol==="file:")return msg("Google sign-in needs the site to run at http://localhost:8000 (see README).");
 const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});if(error)msg(error.message)};
fp.onclick=async ev=>{ev.preventDefault();if(!e.value.trim())return msg("Enter your email first, then click Forgot Password.");
 const{error}=await sb.auth.resetPasswordForEmail(e.value.trim(),location.protocol==="file:"?{}:{redirectTo:location.origin+location.pathname});msg(error?error.message:"If that email is registered, a reset link has been sent.")};
route();
</script></body></html>
